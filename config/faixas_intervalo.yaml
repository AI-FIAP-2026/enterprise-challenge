# Metadados de cada faixa/periodicidade de manutenção programada, por equipamento.
# valor_gatilho em horas (metrica_gatilho=HORIMETRO) ou null (CONDICIONAL/CALENDARIO).
# fator_condicional codifica equivalente de calendário: OU_CALENDARIO:<DIARIO|SEMANAL|MENSAL|ANUAL|2_ANOS|6_ANOS>
# ou AMACIAMENTO_UNICA_VEZ (docs/memoria.md §5/§10, kickoff 1.1).

ch950:
  # códigos de seção do sumário (95-A..M) -> faixa. 95-L e 95-M são a mesma
  # faixa "conforme necessário" (95-M é a continuação por causa de paginação).
  95-A: {nome: "Primeiras 100 horas (amaciamento)", valor_gatilho: 100, metrica_gatilho: HORIMETRO, fator_condicional: AMACIAMENTO_UNICA_VEZ}
  95-B: {nome: "A cada 25 horas ou diariamente", valor_gatilho: 25, metrica_gatilho: HORIMETRO, fator_condicional: "OU_CALENDARIO:DIARIO"}
  95-C: {nome: "A cada 50 horas", valor_gatilho: 50, metrica_gatilho: HORIMETRO}
  95-D: {nome: "A cada 100 horas", valor_gatilho: 100, metrica_gatilho: HORIMETRO}
  95-E: {nome: "A cada 250 horas", valor_gatilho: 250, metrica_gatilho: HORIMETRO}
  95-F: {nome: "A cada 250 horas (continuação)", valor_gatilho: 250, metrica_gatilho: HORIMETRO}
  95-G: {nome: "A cada 500 horas", valor_gatilho: 500, metrica_gatilho: HORIMETRO}
  95-H: {nome: "A cada 1.000 horas", valor_gatilho: 1000, metrica_gatilho: HORIMETRO}
  95-I: {nome: "A cada 1.500 horas", valor_gatilho: 1500, metrica_gatilho: HORIMETRO}
  95-J: {nome: "Anualmente ou a cada 3.000 horas", valor_gatilho: 3000, metrica_gatilho: HORIMETRO, fator_condicional: "OU_CALENDARIO:ANUAL"}
  95-K: {nome: "A cada 6.000 horas", valor_gatilho: 6000, metrica_gatilho: HORIMETRO}
  95-L: {nome: "Conforme necessário", valor_gatilho: null, metrica_gatilho: CONDICIONAL}
  95-M: {nome: "Conforme necessário", valor_gatilho: null, metrica_gatilho: CONDICIONAL}

