# Mapeamento "texto do manual" -> enum de subsistema (docs/memoria.md §5).
# Usado por campo_seguro/nlp/normalize.py. Editável sem mexer em código.

enum:
  - MOTOR
  - COMBUSTIVEL
  - ARREFECIMENTO
  - TRANSMISSAO
  - REDUCOES_TREM_ACIONAMENTO
  - HIDRAULICO
  - FREIOS
  - RODANTE_PNEUS
  - ELETRICO
  - CORTE_PROCESSAMENTO
  - CABINE_ESTRUTURA
  - CHASSI

# 5060E: cabeçalho "Sistema" da tabela 207-2..4 -> enum.
tratores_5060e:
  "Motor": MOTOR
  "Combustível, Admissão de Ar, Exaustão e Arrefecimento": ARREFECIMENTO
  "Trem de acionamento": REDUCOES_TREM_ACIONAMENTO
  "Sistema Hidráulico": HIDRAULICO
  "Rodas e Peças de Fixação": RODANTE_PNEUS
  "Direção e Freios": FREIOS
  "Plataforma do Operador": CABINE_ESTRUTURA
  "Sistema Elétrico": ELETRICO

# CH950: inferência por palavra-chave no título da tarefa (sumário 95-A..M),
# checada em ordem — a primeira que casar vence.
ch950_palavras_chave:
  # ordem importa: buckets mais específicos primeiro — "motor" aparece como
  # qualificador em muitos títulos que não são sobre o motor em si (ex.
  # "Filtro Primário de Combustível (Se Equipado com Motor Final Tier 4...)"),
  # por isso MOTOR fica por último, como o mais genérico.
  - [["combustível", "diesel", "def ", "fluido para escapamento", "tanque de combustível", "admiss", "filtro primário", "filtro prim"], COMBUSTIVEL]
  - [["arrefecimento", "radiador", "resfriador", "líquido de arrefecimento"], ARREFECIMENTO]
  - [["redução final", "diferencial", "caixa de engrenagens de acionamento da bomba", "caixa de engrenagens do picador", "tdp", "acionamento da bomba"], REDUCOES_TREM_ACIONAMENTO]
  - [["hidráulico", "hidráulica", "acumulador", "cilindro"], HIDRAULICO]
  - [["freio", "estacionamento"], FREIOS]
  - [["esteira", "corrente da esteira", "rolete", "roda dentada", "sapata", "eixo traseiro", "eixo dianteiro", "montagem do eixo", "parafusos de impacto"], RODANTE_PNEUS]
  - [["elétric", "aterramento", "bateria"], ELETRICO]
  - [["cortador de base", "picador", "elevador", "extrator", "divisor de linha", "lâmina", "faca", "rolo tombador", "rolo de alimentação", "rolo pré-tombador", "rolamentos do rolo"], CORTE_PROCESSAMENTO]
  - [["cabine", "cinto", "vidro da cabine", "ar-condicionado"], CABINE_ESTRUTURA]
  - [["motor", "óleo do motor", "filtro de óleo", "injetor", "bico injetor", "termostato", "acoplador do motor"], MOTOR]

default: CHASSI

# Leitura automática de manuais sem leitor próprio (campo_seguro/nlp/leitor_automatico.py): palavras-chave em
# português e inglês, checadas em ordem (a primeira que casar vence; MOTOR fica por último por ser a mais genérica).
palavras_chave_gerais:
  - [["combustível", "diesel", "def ", "fluido para escapamento", "separador de água", "filtro primário", "fuel", "water separator"], COMBUSTIVEL]
  - [["arrefecimento", "radiador", "resfriador", "líquido de arrefecimento", "coolant", "radiator", "cooling"], ARREFECIMENTO]
  - [["transmissão", "embreagem", "caixa de câmbio", "transmission", "clutch", "gearbox"], TRANSMISSAO]
  - [["redução final", "diferencial", "caixa de engrenagens", "tdp", "eixo cardan", "final drive", "differential", "pto", "drive shaft"], REDUCOES_TREM_ACIONAMENTO]
  - [["hidráulico", "hidráulica", "acumulador", "cilindro", "hydraulic", "accumulator"], HIDRAULICO]
  - [["freio", "estacionamento", "brake", "parking"], FREIOS]
  - [["pneu", "roda", "esteira", "rolete", "eixo dianteiro", "eixo traseiro", "tire", "tyre", "wheel", "track", "axle"], RODANTE_PNEUS]
  - [["elétric", "bateria", "alternador", "fusível", "farol", "luzes", "electric", "battery", "alternator", "fuse", "light"], ELETRICO]
  - [["cortador", "picador", "elevador", "extrator", "lâmina", "faca", "rolo", "plataforma de corte", "cutter", "chopper", "elevator", "knife", "blade", "header"], CORTE_PROCESSAMENTO]
  - [["cabine", "cinto", "ar-condicionado", "filtro de ar da cabine", "degrau", "cab ", "seat belt", "step"], CABINE_ESTRUTURA]
  - [["motor", "óleo do motor", "filtro de óleo", "filtro de ar", "injetor", "termostato", "correia", "engine", "oil filter", "air filter", "belt"], MOTOR]
